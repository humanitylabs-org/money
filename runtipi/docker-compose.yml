services:
  finances:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    pids_limit: 64
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 128m
    tmpfs:
    - /tmp
    environment:
      PORT: '8809'
      BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: '1'
      DATA_DIR: /data/private
      # Money's own alerts (a bank that needs you, large charges) go through the Notifications app.
      WIZARD_NOTIFY_URL: ${WIZARD_NOTIFY_URL:-http://notifications:8080/mcp}
      MONEY_ALERT_LARGE: ${MONEY_ALERT_LARGE:-500}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
      # Actual Budget, bundled below (switch finances:actual-budget, money#38).
      MONEY_ACTUAL_URL: http://finances-actual:5006
    working_dir: /app
    volumes:
    - ${APP_SOURCE_DIR}:/app:ro
    - ${APP_DATA_DIR}/data:/data
    read_only: true
    command: [python, /app/app/server.py]
    init: true
    x-runtipi:
      is_main: true
      internal_port: 8809
  # Stock Actual Budget server (official image, pinned, no fork). No port: only Finances reaches it, on this app's
  # own network. Finances uses it only while the switch finances:actual-budget is on; its data sits beside Finances'.
  finances-actual:
    image: actualbudget/actual-server:26.11.0@sha256:06cf186569cf58d93e12659ff1a517b65b5b0ebee7050a3991d4bd8a1d398da6
    pids_limit: 128
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 256m
    read_only: true
    tmpfs:
    - /tmp
    environment:
      ACTUAL_PORT: '5006'
      ACTUAL_SERVER_FILES: /data/actual-server
      ACTUAL_USER_FILES: /data/actual-files
    volumes:
    - ${APP_DATA_DIR}/data:/data
x-runtipi:
  schema_version: 2
  overrides: []
