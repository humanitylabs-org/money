services:
  finances:
    image: python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4
    pids_limit: 64
    user: 1000:1000
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 128m
    tmpfs:
    - /tmp
    environment:
      PORT: '8809'
      BIND: 0.0.0.0
      PYTHONDONTWRITEBYTECODE: '1'
      DATA_DIR: /data/private
      # Money's own alerts (a bank that needs you, large charges) go through the Notifications app.
      WIZARD_NOTIFY_URL: ${WIZARD_NOTIFY_URL:-http://notifications:8080/mcp}
      MONEY_ALERT_LARGE: ${MONEY_ALERT_LARGE:-500}
      WIZARD_TRUSTED_HOSTS: ${WIZARD_TRUSTED_HOSTS:-}
      WIZARD_TRUSTED_ORIGINS: ${WIZARD_TRUSTED_ORIGINS:-}
    working_dir: /app
    volumes:
    - ${APP_SOURCE_DIR}:/app:ro
    - ${APP_DATA_DIR}/data:/data
    read_only: true
    command: [python, /app/app/server.py]
    init: true
    x-runtipi:
      is_main: true
      internal_port: 8809
x-runtipi:
  schema_version: 2
  overrides: []
